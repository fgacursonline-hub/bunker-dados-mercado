name: Robô de Dados do Bunker

on:
  schedule:
    # Foge do tráfego do minuto zero (Roda aos 17 minutos de cada hora)
    - cron: '17 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [acionar_robo_agora]

permissions:
  contents: write

concurrency:
  group: bunker-atualizacao
  cancel-in-progress: false

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Baixar o código
      uses: actions/checkout@v4
      with:
        ref: main 

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar bibliotecas
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ligar o Motor Quantitativo
      run: python atualizador.py

    - name: Publicar CSVs no Bunker
      run: |
        git config user.name "Bunker Bot"
        git config user.email "bunkerbot@cacadores.elite"
        git add -- '*.csv'
        
        # Só faz o commit se houver mudanças reais nos ficheiros
        if git diff --cached --quiet; then
          echo "Nenhum dado novo. Ignorando commit."
        else
          git commit -m "🤖 Atualização de cotações - Radar Caçadores de Elite"
          git push origin HEAD:main
        fi
