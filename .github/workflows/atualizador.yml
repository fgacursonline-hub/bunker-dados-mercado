name: Robô de Dados do Bunker

on:
  workflow_dispatch:
  schedule:
    # Rodando aos 30 minutos das: 13h, 15h, 17h, 19h e 21h (UTC)
    # Equivalente a 10:30, 12:30, 14:30, 16:30 e 18:30 (Brasília)
    - cron: "30 13,15,17,19,21 * * 1-5"

permissions:
  contents: write

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código
      uses: actions/checkout@v4
      with:
        ref: main 

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar bibliotecas
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ligar o Motor Quantitativo
      run: python motor_dados.py

    - name: Guardar os novos dados no Bunker (Commit & Push)
      run: |
        git config --global user.name "Bunker Bot"
        git config --global user.email "bunkerbot@cacadores.elite"
        git add *.csv 
        git commit -m "🤖 Atualização de cotações - Radar Caçadores de Elite" || echo "Sem novos dados para salvar"
        git push origin main
