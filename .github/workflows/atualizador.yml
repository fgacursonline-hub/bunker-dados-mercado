name: Robô de Dados do Bunker

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1-5"
    - cron: "0 14,16,18,19 * * 1-5"
    
permissions:
  contents: write

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar bibliotecas
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ligar o Motor
      run: python motor_dados.py

    - name: Guardar os novos dados no Bunker (Commit & Push)
      run: |
        git config --global user.name "Bunker Bot"
        git config --global user.email "bunkerbot@github.local"
        git add .
        git commit -m "Atualização automática de cotações" || echo "Sem novos dados para salvar"
        git push
