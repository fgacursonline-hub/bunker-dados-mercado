name: Robô de Dados do Bunker

on:
  workflow_dispatch: # Permite apertar o botão de Play manualmente
  schedule:
    # Horários em UTC (Soma 3 horas para Brasília)
    # 13h (10h BRT - Abertura)
    # 16h (13h BRT - Meio do Pregão)
    # 20h (17h BRT - Fechamento B3)
    # 21h (18h BRT - After-Market)
    - cron: "0 13,16,20,21 * * 1-5"

permissions:
  contents: write

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código
      uses: actions/checkout@v4
      with:
        ref: main # OBRIGATÓRIO: Garante que o robô está na branch correta

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar bibliotecas
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ligar o Motor Quantitativo
      run: python motor_dados.py

    - name: Guardar os novos dados no Bunker (Commit & Push)
      run: |
        git config --global user.name "Bunker Bot"
        git config --global user.email "bunkerbot@cacadores.elite"
        # Adiciona apenas os CSVs para evitar subir arquivos de lixo
        git add *.csv 
        git commit -m "🤖 Atualização automática de cotações B3/EUA" || echo "Sem novos dados para salvar"
        # Força o push especificando a origem e a branch
        git push origin main
