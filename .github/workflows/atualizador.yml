name: Robô de Dados do Bunker

on:
  workflow_dispatch:
  repository_dispatch:
    types: [acionar_robo_agora]

permissions:
  contents: write

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código
      uses: actions/checkout@v4
      with:
        ref: main 

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar bibliotecas
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ligar o Motor Quantitativo
      run: python motor_dados.py

    - name: Guardar os novos dados no Bunker (Commit & Push)
      run: |
        git config --global user.name "Bunker Bot"
        git config --global user.email "bunkerbot@cacadores.elite"
        git add *.csv 
        git commit -m "🤖 Atualização de cotações - Radar Caçadores de Elite" || echo "Sem novos dados para salvar"
        git push origin main
